# Blueprint de Render (https://render.com/docs/blueprint-spec): la API como servicio web Docker, plan gratuito.
# El plan gratuito suspende el servicio tras 15 minutos sin tráfico; el primer pedido posterior tarda ~1 minuto.
services:
  - type: web
    name: premier-predictor-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Reemplazar por el dominio de GitHub Pages del sitio (p. ej. https://<usuario>.github.io).
      - key: ALLOWED_ORIGINS
        value: "*"
