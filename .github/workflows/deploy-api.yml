name: Deploy de la API (Cloud Run)

# La imagen descarga y procesa los datos al construirse, así que se reconstruye:
#  - con cada cambio de código de la API en main,
#  - dos veces por semana (datos nuevos), después de que se publica la web,
#  - a mano (workflow_dispatch).
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/export/**"   # exportación de la web: no entra en la imagen de la API
      - "configs/**"
      - "models/**"
      - "Dockerfile"
      - "requirements-api.txt"
      - "requirements-build.txt"
      - ".github/workflows/deploy-api.yml"
  schedule:
    - cron: "30 6 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # para Workload Identity Federation (sin claves JSON)

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE: premier-predictor-api
  REPOSITORY: premier-predictor

jobs:
  deploy:
    # No corre hasta que el proyecto de Google Cloud esté configurado (docs/deploy_cloud_run.md).
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build y push de la imagen
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}
          region: ${{ env.REGION }}
          # Escala a cero (sin costo en reposo) y máximo 2 instancias para acotar el gasto.
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --max-instances=2
            --concurrency=40
            --timeout=30
            --service-account=${{ vars.GCP_RUNTIME_SA }}
          env_vars: |
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS || '*' }}

      - name: Smoke test
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          curl -fsS "$URL/health"
          curl -fsS "$URL/predict?home=Arsenal&away=Chelsea&date=2024-01-20" | head -c 300
