name: Monitoreo · registrar y evaluar predicciones

# Todos los días:
#  1. registra la predicción de cada partido de Premier publicado con fecha posterior a hoy (UTC)
#     en la rama `monitoring` (registro inmutable);
#  2. evalúa las predicciones ya jugadas contra el resultado y contra el mercado;
#  3. si algún indicador sale de su rango de alerta, abre (o comenta) un issue `model-alert`;
#  4. si hubo cambios, vuelve a publicar la web para que la página de monitoreo se actualice.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # escribir en la rama monitoring
  issues: write     # abrir/comentar alertas
  actions: write    # disparar la publicación de la web

concurrency:
  group: monitoring
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout de la rama monitoring
        uses: actions/checkout@v7
        with:
          ref: monitoring
          path: monitoring-branch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Datos actualizados y estado de los equipos
        run: |
          python -m src.data.download
          python -m src.data.load
          python -m src.serving.build_state

      - name: Registrar predicciones de los próximos partidos
        run: |
          cp monitoring-branch/ledger/predictions.csv /tmp/before.csv
          python -m src.monitoring.ledger --ledger monitoring-branch/ledger/predictions.csv
          python - <<'EOF'
          from pathlib import Path
          from src.monitoring.ledger import verify_append_only
          verify_append_only(Path("/tmp/before.csv").read_text(encoding="utf-8"),
                             Path("monitoring-branch/ledger/predictions.csv").read_text(encoding="utf-8"))
          print("Integridad verificada: el registro anterior quedó intacto.")
          EOF

      # Modelo en evaluación (docs/preregistro_tiros.md). El paso es protegido: si falla, se descartan sus
      # cambios del día y el monitoreo del modelo de producción sigue; esos partidos quedan fuera de la comparación.
      - name: Registrar predicciones del modelo en evaluación (tiros)
        run: |
          python -m src.monitoring.guarded --file monitoring-branch/ledger/shadow_predictions.csv \
            --label "el registro del modelo con tiros" -- \
            python -m src.monitoring.shadow_ledger --model tiros --ledger monitoring-branch/ledger/shadow_predictions.csv

      # Modelo anterior (Elo de resultados), registrado en paralelo desde que el rating basado en cuotas pasó a
      # producción (enmienda de docs/preregistro_cuotas.md). Mismo mecanismo protegido.
      - name: Registrar predicciones del modelo anterior (Elo)
        run: |
          python -m src.monitoring.guarded --file monitoring-branch/ledger/shadow_elo_predictions.csv \
            --label "el registro del modelo anterior" -- \
            python -m src.monitoring.shadow_ledger --model elo --ledger monitoring-branch/ledger/shadow_elo_predictions.csv

      - name: Evaluar contra los resultados
        run: |
          python -m src.monitoring.evaluate --ledger monitoring-branch/ledger/predictions.csv \
            --shadow-ledger monitoring-branch/ledger/shadow_predictions.csv \
            --shadow-elo-ledger monitoring-branch/ledger/shadow_elo_predictions.csv \
            --out monitoring-branch/reports --issue-body /tmp/issue.md

      - name: Guardar en la rama monitoring
        id: save
        working-directory: monitoring-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW=$(git diff --numstat ledger/predictions.csv | cut -f1)
          git add ledger/ reports/
          if git diff --cached --quiet; then echo "Sin cambios."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          STATUS=$(python -c "import json;print(json.load(open('reports/latest.json'))['status'])")
          git commit -m "Monitoreo $(date -u +%F): ${NEW:-0} predicciones nuevas · estado ${STATUS}"
          git push origin monitoring
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Alerta (issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f /tmp/issue.md ]; then echo "Sin alertas."; exit 0; fi
          gh label create model-alert --color B60205 --description "Alerta del monitoreo del modelo" --force
          OPEN=$(gh issue list --label model-alert --state open --json number --jq '.[0].number')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body-file /tmp/issue.md
          else
            gh issue create --title "Monitoreo: alerta del modelo ($(date -u +%F))" --label model-alert --body-file /tmp/issue.md
            # Alerta nueva: evaluar automáticamente modelos candidatos (el reporte llega como issue).
            gh workflow run retrain.yml --ref main -f mode=candidatos
          fi

      - name: Publicar la web con el reporte nuevo
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
