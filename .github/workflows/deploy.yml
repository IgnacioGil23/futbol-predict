name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 6 * * 1,4"   # lunes y jueves, 06:00 UTC
  push:                     # y cuando cambia la web o lo que se exporta
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "models/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Rama monitoring (reporte de la temporada en curso)
        run: |
          if git fetch --depth=1 origin monitoring 2>/dev/null; then
            git show origin/monitoring:reports/latest.json > /tmp/monitoring.json 2>/dev/null || rm -f /tmp/monitoring.json
          fi
          ls -la /tmp/monitoring.json 2>/dev/null || true
      - name: Descargar datos, recalcular features y exportar JSON
        run: |
          python -m src.data.download
          python -m src.data.load
          python -m src.features.build
          python -m src.serving.build_state
          python -m src.export.site --out web/public/data
          if [ -f /tmp/monitoring.json ]; then cp /tmp/monitoring.json web/public/data/monitoring.json; echo "Reporte de monitoreo incluido."
          else rm -f web/public/data/monitoring.json; echo "Todavía no hay reporte de monitoreo."; fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vitest run
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # URL pública de la API en Cloud Run (Settings > Secrets and variables > Actions > Variables).
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
